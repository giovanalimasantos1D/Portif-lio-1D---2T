<!DOCTYPE html> <!--<div class=""></div>serve para identificar a linguagem de progamaçâo que está sendo ultilizada.-->
<html lang="pt-br"> <!--abertura do documento, delimita o espaço de codificação. Todas as tags devem ser colocadas nesse espaço-->
<head> <!--tag que define o cabeçalho do documento. Tudo que for escrito dentro dessa tag não aparecerá na pagina pricipal. dentro dessa tag pode ser inserida folhas de estilo e script. -->
    <meta charset="UTF-8"> <!-- especifica qual o conjunto de caracteres (character set ou charset) sera usado para redentificar o texto da pagina.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--forcene os motadados subre a sua página-->
    <title>Portfólio</title>  <!--título da página-->
</head> <!--fechamneto do cabeçalho-->
<body> <!--nessse espaço esta contido o conteudo visual da pagina. As tags que representam texto, botoes e outros,deven ser adicionadas nesse intervalo-->
<!--Um documento HTML e composto por tags que sao escritas entre < >. As tags precisam ser abertas e fechadas, oque as diferenciam e que tags de fechamento passuem uma \ antes do nome. alguns codigos nao precisaam da <\> para fechamento, apenas da barra, ou nem isso, como no caso da tag meta. Outro aspetcoimportante e que case insesitive, ou seja, nao leva em consideraçao a diferença entre letras oficiais e minusculas -->

<h1> matematica</h1>


</html> <!-- fechamento da tag-->
